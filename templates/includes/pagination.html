{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="pagination">
    {% if page_obj.has_previous %}
        <a href="?{{ filter_query }}{% if filter_query %}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Назад</a>
    {% endif %}
    <span>Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a href="?{{ filter_query }}{% if filter_query %}&amp;{% endif %}page={{ page_obj.next_page_number }}">Вперёд →</a>
    {% endif %}
</nav>
{% endif %}
