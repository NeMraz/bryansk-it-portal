{% extends 'base.html' %}

{% block content %}
  <h1>Модерация объявлений</h1>
  <p>Ждут проверки: {{ posts|length }}</p>

  {% for post in posts %}
    <div class="card">
      <h2>{{ post.title }}</h2>
      <p>Автор: {{ post.author.username }} | {{ post.created_at|date:"d.m.Y H:i" }}</p>
      <a href="{% url 'team_board:moderate' post.pk %}">Проверить</a>
    </div>
  {% empty %}
    <p>Очередь пуста.</p>
  {% endfor %}
{% endblock %}
