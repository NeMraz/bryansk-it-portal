{% extends "base.html" %}

{% block title %}Удалить проект · IT-Брянск{% endblock %}

{% block content %}
  <h1>Удалить проект «{{ project.title }}»?</h1>
  <p>Это действие нельзя отменить.</p>
  <form method="post">
    {% csrf_token %}
    <div class="btn-group">
      <button type="submit" class="btn">Да, удалить</button>
      <a href="{{ project.get_absolute_url }}" class="btn-ghost">Отмена</a>
    </div>
  </form>
{% endblock %}
